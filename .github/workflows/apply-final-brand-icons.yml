name: Apply final SmartThings icon

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-final-brand-icons.yml

permissions:
  contents: write

concurrency:
  group: apply-final-smartthings-find-icon
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out latest main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare latest branch state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B icon-release origin/main

      - name: Download and validate final icon
        shell: bash
        run: |
          set -euo pipefail
          source_base="https://raw.githubusercontent.com/1bobby-git/brands/464246d3df46c9426ec9dc6873a6f9561a326d2c/custom_integrations/smartthings_find"
          tmp="$(mktemp -d)"
          echo "ICON_TMP=${tmp}" >> "${GITHUB_ENV}"
          curl --fail --location --retry 3 --retry-delay 2 "${source_base}/icon.png" --output "${tmp}/icon.png"
          curl --fail --location --retry 3 --retry-delay 2 "${source_base}/icon@2x.png" --output "${tmp}/icon@2x.png"
          python - "${tmp}/icon.png" 256 "${tmp}/icon@2x.png" 512 <<'PY'
          from pathlib import Path
          import struct
          import sys

          for raw_path, expected in zip(sys.argv[1::2], sys.argv[2::2], strict=True):
              path = Path(raw_path)
              size = int(expected)
              data = path.read_bytes()
              if data[:8] != b"\x89PNG\r\n\x1a\n" or data[12:16] != b"IHDR":
                  raise SystemExit(f"Invalid PNG: {path}")
              width, height = struct.unpack(">II", data[16:24])
              if (width, height) != (size, size):
                  raise SystemExit(f"Unexpected size for {path}: {width}x{height}")
              color_type = data[25]
              if color_type not in {3, 6}:
                  raise SystemExit(f"PNG lacks alpha-capable color type: {path}")
              if color_type == 3 and b"tRNS" not in data:
                  raise SystemExit(f"Indexed PNG lacks transparency: {path}")
          PY

      - name: Apply icon and update release metadata
        shell: bash
        run: |
          set -euo pipefail
          install -m 0644 "${ICON_TMP}/icon.png" custom_components/smartthings_find/brand/icon.png
          install -m 0644 "${ICON_TMP}/icon@2x.png" custom_components/smartthings_find/brand/icon@2x.png

          python - <<'PY'
          from pathlib import Path
          import json

          manifest_path = Path("custom_components/smartthings_find/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("version") != "1.3.2":
              raise SystemExit(f"Unexpected current version: {manifest.get('version')}")
          manifest["version"] = "1.3.3"
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          heading = "## 1.3.3"
          if heading not in changelog:
              entry = (
                  "## 1.3.3 - 2026-09-02\n\n"
                  "- SmartThings Web과 동일한 최종 SmartThings 기본 아이콘을 적용했습니다.\n"
                  "- Home Assistant 로컬 Brands Proxy API용 256px 및 512px 투명 PNG를 갱신했습니다.\n"
                  "- 위치 조회, 로그인 및 기기 명령 동작은 변경하지 않았습니다.\n\n"
              )
              if changelog.startswith("# "):
                  first, rest = changelog.split("\n", 1)
                  changelog_path.write_text(first + "\n\n" + entry + rest.lstrip("\n"), encoding="utf-8")
              else:
                  changelog_path.write_text(entry + changelog, encoding="utf-8")
          PY

          rm -rf "${ICON_TMP}"
          git diff --check

      - name: Run regression checks
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q custom_components/smartthings_find
          python -m unittest discover -s tests

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-final-brand-icons.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update SmartThings Find default icon for 1.3.3"
          git push origin HEAD:main
