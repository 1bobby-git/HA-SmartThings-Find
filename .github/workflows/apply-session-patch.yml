name: Apply persistent session patch

on:
  push:
    branches:
      - feat/persistent-samsung-session

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[session-patch-applied]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/persistent-samsung-session
          fetch-depth: 0
      - name: Apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          cat tools/session-patch.part* > /tmp/session-patch.b64
          base64 --decode /tmp/session-patch.b64 > /tmp/session-patch.tar.gz
          echo "a1d9f8328ad82f5a65e8214d8a3c6bef8674c63d7e9068f357f7658151518cf1  /tmp/session-patch.tar.gz" | sha256sum --check -
          tar -xzf /tmp/session-patch.tar.gz
          rm -f tools/session-patch.part*
          rmdir tools 2>/dev/null || true
          rm -f .github/workflows/apply-session-patch.yml
      - name: Commit applied patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add renewable Samsung session recovery [session-patch-applied]"
          git push origin HEAD:feat/persistent-samsung-session
