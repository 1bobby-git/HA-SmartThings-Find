name: Reapply SmartThings Find local brand icon

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reapply-local-brand-icon.yml

permissions:
  contents: write

concurrency:
  group: reapply-smartthings-find-local-brand-icon
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out latest main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare latest branch state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B local-brand-release origin/main

      - name: Install image tooling
        shell: bash
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Apply final SmartThings icons
        shell: bash
        run: |
          set -euo pipefail
          source_base="https://raw.githubusercontent.com/1bobby-git/brands/4620f91aab78031a7b99749c97ff8f7748fd35c5/custom_integrations/smartthings_find"
          tmp="$(mktemp -d)"
          trap 'rm -rf "${tmp}"' EXIT

          curl --fail --location --retry 3 --retry-delay 2 "${source_base}/icon.png" --output "${tmp}/icon.png"
          curl --fail --location --retry 3 --retry-delay 2 "${source_base}/icon@2x.png" --output "${tmp}/icon@2x.png"

          python - "${tmp}/icon.png" "${tmp}/icon@2x.png" <<'PY'
          from pathlib import Path
          from PIL import Image
          import sys

          for raw_path, expected in ((sys.argv[1], (256, 256)), (sys.argv[2], (512, 512))):
              path = Path(raw_path)
              image = Image.open(path).convert("RGBA")
              if image.size != expected:
                  raise SystemExit(f"Unexpected size for {path}: {image.size}")
              if image.getchannel("A").getextrema() != (0, 255):
                  raise SystemExit(f"Missing transparency in {path}")
              image.save(path, format="PNG", optimize=True, compress_level=9)
          PY

          install -m 0644 "${tmp}/icon.png" custom_components/smartthings_find/brand/icon.png
          install -m 0644 "${tmp}/icon@2x.png" custom_components/smartthings_find/brand/icon@2x.png

          python - <<'PY'
          from pathlib import Path
          import json

          manifest_path = Path("custom_components/smartthings_find/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("version") != "1.3.3":
              raise SystemExit(f"Unexpected current version: {manifest.get('version')}")
          manifest["version"] = "1.3.4"
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          heading = "## 1.3.4 - 2026-09-02"
          if heading not in changelog:
              entry = (
                  "## 1.3.4 - 2026-09-02\n\n"
                  "- 마지막으로 확정한 SmartThings 기본 아이콘을 다시 적용했습니다.\n"
                  "- Home Assistant 로컬 Brands Proxy API가 사용할 256px 및 512px 투명 PNG를 컴포넌트 패키지에 포함했습니다.\n"
                  "- 위치 조회, 로그인 및 기기 명령 동작은 변경하지 않았습니다.\n\n"
              )
              if changelog.startswith("# "):
                  first, rest = changelog.split("\n", 1)
                  changelog_path.write_text(first + "\n\n" + entry + rest.lstrip("\n"), encoding="utf-8")
              else:
                  changelog_path.write_text(entry + changelog, encoding="utf-8")
          PY

          git diff --check
          python -m compileall -q custom_components/smartthings_find
          python -m unittest discover -s tests

      - name: Commit local brand release
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/reapply-local-brand-icon.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reapply SmartThings Find local brand icon for 1.3.4"
          git push origin HEAD:main
