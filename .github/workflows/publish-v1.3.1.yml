name: Publish SmartThings Find v1.3.1

on:
  push:
    branches:
      - release/v1.3.1

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 1bff94947f305363d9dc0542ca2099b7561f60e3
        run: |
          if gh release view v1.3.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create v1.3.1 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "SmartThings Find v1.3.1" \
            --notes $'- 회전 세션 쿠키를 Home Assistant 비공개 저장소로 분리\n- config-entry 단일 기기 모델에 맞춘 식별자 마이그레이션\n- 일부 기기 조회 실패 시 마지막 정상 데이터 유지\n- 위치 갱신 및 벨 명령 실패·pending 상태 처리 개선'
