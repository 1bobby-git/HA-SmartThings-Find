name: Apply SmartThings Find brand artwork once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-smartthings-find-brand-once.yml

permissions:
  contents: write

concurrency:
  group: apply-smartthings-find-brand-once
  cancel-in-progress: false

jobs:
  apply:
    name: Generate supplied icon and horizontal logos
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Generate brand assets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check Pillow
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import io
          from pathlib import Path

          from PIL import Image

          source_root = Path(".github/brand-source")
          output_root = Path("custom_components/smartthings_find/brand")
          output_root.mkdir(parents=True, exist_ok=True)

          icon_source = Image.open(
              io.BytesIO(base64.b64decode((source_root / "icon.b64").read_text(encoding="ascii")))
          ).convert("RGBA")
          wordmark_alpha = Image.open(
              io.BytesIO(base64.b64decode((source_root / "wordmark-alpha.b64").read_text(encoding="ascii")))
          ).convert("L")

          if icon_source.size != (93, 91):
              raise SystemExit(f"Unexpected supplied icon crop: {icon_source.size}")
          if wordmark_alpha.size != (650, 86):
              raise SystemExit(f"Unexpected supplied wordmark crop: {wordmark_alpha.size}")

          def resize_rgba(image: Image.Image, size: tuple[int, int]) -> Image.Image:
              return image.convert("RGBa").resize(size, Image.Resampling.LANCZOS).convert("RGBA")

          def make_icon(canvas_size: int, visual_width: int) -> Image.Image:
              visual_height = round(icon_source.height * visual_width / icon_source.width)
              mark = resize_rgba(icon_source, (visual_width, visual_height))
              canvas = Image.new("RGBA", (canvas_size, canvas_size), (0, 0, 0, 0))
              canvas.alpha_composite(
                  mark,
                  ((canvas_size - visual_width) // 2, (canvas_size - visual_height) // 2),
              )
              return canvas

          def make_wordmark(size: tuple[int, int], dark: bool) -> Image.Image:
              alpha = wordmark_alpha.resize(size, Image.Resampling.LANCZOS)
              color = (255, 255, 255, 0) if dark else (37, 37, 37, 0)
              wordmark = Image.new("RGBA", size, color)
              wordmark.putalpha(alpha)
              return wordmark

          def make_logo(width: int, height: int, dark: bool) -> Image.Image:
              source_gap = 24
              target_group_width = round(width * 946 / 986)
              scale = target_group_width / (
                  icon_source.width + source_gap + wordmark_alpha.width
              )
              icon_width = round(icon_source.width * scale)
              icon_height = round(icon_source.height * scale)
              text_width = round(wordmark_alpha.width * scale)
              text_height = round(wordmark_alpha.height * scale)
              gap = round(source_gap * scale)
              group_width = icon_width + gap + text_width

              mark = resize_rgba(icon_source, (icon_width, icon_height))
              wordmark = make_wordmark((text_width, text_height), dark)
              canvas = Image.new("RGBA", (width, height), (0, 0, 0, 0))
              x = (width - group_width) // 2
              canvas.alpha_composite(mark, (x, (height - icon_height) // 2))
              canvas.alpha_composite(
                  wordmark,
                  (x + icon_width + gap, (height - text_height) // 2),
              )
              return canvas

          assets = {
              "icon.png": make_icon(256, 224),
              "icon@2x.png": make_icon(512, 448),
              "logo.png": make_logo(986, 200, False),
              "logo@2x.png": make_logo(1972, 400, False),
              "dark_logo.png": make_logo(986, 200, True),
              "dark_logo@2x.png": make_logo(1972, 400, True),
          }

          expected_sizes = {
              "icon.png": (256, 256),
              "icon@2x.png": (512, 512),
              "logo.png": (986, 200),
              "logo@2x.png": (1972, 400),
              "dark_logo.png": (986, 200),
              "dark_logo@2x.png": (1972, 400),
          }
          for name, image in assets.items():
              if image.size != expected_sizes[name] or image.mode != "RGBA" or image.getbbox() is None:
                  raise SystemExit(f"Invalid generated asset: {name}")
              image.save(output_root / name, format="PNG", optimize=True, compress_level=9)
          PY

      - name: Commit generated assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/smartthings_find/brand
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "feat: apply supplied SmartThings Find brand assets"
            git push
          fi
