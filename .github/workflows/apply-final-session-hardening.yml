name: Apply final session hardening

on:
  push:
    branches:
      - feat/persistent-samsung-session

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[final-session-hardening-applied]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/persistent-samsung-session
          fetch-depth: 0
      - name: Apply and verify final hardening
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_final_hardening.py
          rm tools/apply_final_hardening.py
          rmdir tools 2>/dev/null || true
          python -m compileall -q custom_components/smartthings_find
          python -m unittest discover -s tests
          git diff --check
      - name: Commit hardened session behavior
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: persist server cookie deletion before session repair [final-session-hardening-applied]"
          git push origin HEAD:feat/persistent-samsung-session
