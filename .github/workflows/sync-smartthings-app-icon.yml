name: Sync SmartThings app icon

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-smartthings-app-icon.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true

      - name: Download and fully validate cropped app icons
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/1bobby-git/brands/f2bffd723295b6b3041e238bb054bf54c88d2f15/custom_integrations/smartthings_find"
          target="custom_components/smartthings_find/brand"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          curl --fail --location --retry 3 --retry-delay 2 "$base/icon.png" --output "$tmp/icon.png"
          curl --fail --location --retry 3 --retry-delay 2 "$base/icon@2x.png" --output "$tmp/icon@2x.png"

          python - "$tmp/icon.png" 256 "$tmp/icon@2x.png" 512 <<'PY'
          from pathlib import Path
          import binascii
          import sys
          import zlib

          signature = b"\x89PNG\r\n\x1a\n"

          for raw_path, raw_size in zip(sys.argv[1::2], sys.argv[2::2], strict=True):
              path = Path(raw_path)
              size = int(raw_size)
              data = path.read_bytes()
              if data[:8] != signature or data[12:16] != b"IHDR":
                  raise SystemExit(f"Invalid PNG header: {path}")

              width = int.from_bytes(data[16:20], "big")
              height = int.from_bytes(data[20:24], "big")
              bit_depth = data[24]
              color_type = data[25]
              if (width, height, bit_depth) != (size, size, 8):
                  raise SystemExit(f"Unexpected PNG metadata: {path} {width}x{height} depth={bit_depth}")
              if color_type not in (3, 6):
                  raise SystemExit(f"Unsupported PNG color type: {path} type={color_type}")

              offset = len(signature)
              idat = []
              has_transparency = color_type == 6
              saw_iend = False
              while offset + 12 <= len(data):
                  length = int.from_bytes(data[offset:offset + 4], "big")
                  chunk_type = data[offset + 4:offset + 8]
                  chunk_data = data[offset + 8:offset + 8 + length]
                  chunk_crc = data[offset + 8 + length:offset + 12 + length]
                  if len(chunk_data) != length or len(chunk_crc) != 4:
                      raise SystemExit(f"Truncated PNG chunk: {path}")
                  expected_crc = binascii.crc32(chunk_type + chunk_data) & 0xFFFFFFFF
                  if expected_crc != int.from_bytes(chunk_crc, "big"):
                      raise SystemExit(f"PNG CRC mismatch: {path} {chunk_type!r}")
                  if chunk_type == b"IDAT":
                      idat.append(chunk_data)
                  elif chunk_type == b"tRNS":
                      has_transparency = True
                  elif chunk_type == b"IEND":
                      saw_iend = True
                      break
                  offset += length + 12

              if not idat or not saw_iend or not has_transparency:
                  raise SystemExit(f"Incomplete or non-transparent PNG: {path}")
              zlib.decompress(b"".join(idat))
          PY

          install -m 0644 "$tmp/icon.png" "$target/icon.png"
          install -m 0644 "$tmp/icon@2x.png" "$target/icon@2x.png"
          git diff --check

      - name: Commit synchronized icons
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/smartthings_find/brand/icon.png custom_components/smartthings_find/brand/icon@2x.png
          if git diff --cached --quiet; then
            echo "Icons already match the cropped source."
            exit 0
          fi
          git commit -m "Use cropped SmartThings app icon"
          git push origin HEAD:main
