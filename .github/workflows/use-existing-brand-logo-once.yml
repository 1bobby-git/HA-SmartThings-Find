name: Use existing SmartThings brand logo

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/use-existing-brand-logo-once.yml

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply existing horizontal brand logo
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          pattern = re.compile(
              r'(?s)(<!-- project-branding:start -->\s*<p align="center">\s*)'
              r'<img src="[^"]+" alt="[^"]+" width="\d+">'
          )
          replacement = (
              r'\1<img src="custom_components/smartthings_find/brand/logo@2x.png" '
              r'alt="SmartThings Find 로고" width="520">'
          )
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit("README branding image was not found exactly once")
          readme.write_text(updated, encoding="utf-8")
          PY

          rm -f media/readme-logo.svg
          rm -f .github/workflows/use-existing-brand-logo-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "docs: use existing SmartThings Find brand logo"
            git push
          fi
